[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effekseer-ai"
version = "0.1.0"
description = "CLI and MCP tools for AI-authored Effekseer effects"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "laodeng000" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0",
    "pythonnet>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
effekseer-ai = "effekseer_ai.cli:main"
effekseer-ai-mcp = "effekseer_ai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
effekseer_ai = ["runtime/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises an installed official Effekseer Core assembly"]
