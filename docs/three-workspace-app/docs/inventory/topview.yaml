known_limits:
- Supported local model import is GLB/GLTF; this is not a scene FBX exporter
- No built-in motion library; animation authoring and retargeting remain separate workspace responsibilities
- CLI requires a single writer; no cross-process lock is taken, so concurrent writers to one project are unsupported
