  doc034_report: ../evidence/trajectory.yaml
  doc035_evidence: "DOC-035: scene.evaluate đọc asset đã kiểm SHA/path và trả skeletonSamples CPU gồm đủ bone local pose/world matrices, placementMatrix, trajectoryMatrix, actorWorldMatrix và metersPerUnit. Dùng chung buildCharacterRig, CharacterAnimator/MotionPlayer và root sampler với browser; entrypoint /skeleton riêng không kéo renderer/MediaBunny. Native model/motion templates không bị sửa; đọc không đổi revision/history. Browser/API đối chiếu65 bone FBX thật đạt max world-matrix delta4.440892098500626e-16. Builder94 files/544 tests; Studio/shared/Retarget37/37; build/typechecks/targeted lint đạt. Thiếu source, texture/compression không decode được, rig không hỗ trợ hoặc library pose chưa nạp trả issue rõ ràng; loader chặn tài nguyên ngoài. Còn thiếu range bake/export, native Animation, Retarget khác rig, geometry checks/render và Film/game; production EPERM/clone500 chưa sửa."
  doc035_report: ../evidence/headless-skeleton.yaml
  doc036_evidence: "DOC-036: sampler CPU stream range inclusive sang grid20Hz + một endpoint left; 3s@30 cho61 mẫu, đoạn1s cho21. Endpoint chọn clip trước tại cut, loop/reverse không wrap về pose đầu; trajectory/path cùng ownership, trim/speed/fractional time giữ nguyên. Host chọn CharacterID tường minh, preflight source một lần và dispose trong finally; không tạo artifact sản phẩm/job. API/range nay áp saved user keys như browser mặc định. Range FBX thật phát hiện pose reset làm hỏng64 alias; applyPose bỏ qua alias và stopAll dừng cả action đã clamped. Browser kiểm đủ64 alias identity sau gap và giữ CPU/browser65-bone parity. Builder95 files/549 tests; Studio/shared/Retarget37/37; build/typechecks/targeted lint đạt. Chưa có converter/export/job/Film codec hoàn chỉnh hoặc camera/shot export endpoint; full acceptance còn thiếu."
