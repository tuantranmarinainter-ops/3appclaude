checkpoint: DOC-046
date: 2026-10-19
scope:
  listcode:
    - 1.7.1
    - 1.7.3
  summary: Bake shared-project skeleton samples into editable BBS pose_transform tracks using converter BOBJ global rest matrices.
implementation:
  pose_bake: three-workspace-app/editor/apps/studio/src/filmPoseBake.ts
  project_integration: three-workspace-app/editor/apps/studio/src/unifiedFilmSampling.ts
  tests:
    - three-workspace-app/editor/apps/studio/test/filmPoseBake.test.ts
    - three-workspace-app/editor/apps/studio/test/unifiedAssetImport.test.ts
  behavior:
    - Reconciles source rest hierarchy with each BOBJ global rest matrix and rejects bones that do not share one source-to-BOBJ basis.
    - Removes actor world placement and derives each editable local pose delta from source rest to sampled pose.
    - Emits finite BBS pose_transform translation, scale, rotation and auxiliary channels with continuous Euler angles.
    - Rejects incompatible hierarchy, singular/sheared transforms and invalid scales instead of producing misleading Film keys.
runtime:
  fixture: Punch Combo FBX source-import and project-sampling integration; typed synthetic BOBJ profile generated from its source SkeletonProfile.
  result: All 65 bones bake to 21 finite keys over ticks 0..20; project snapshot remains immutable. Three-bone Blender 4.2.3 FBX was converted by the actual BBS converter and its BOBJ global rest matrices were compared with Three FBXLoader rest matrices; one common basis held with maximum spread 3.469446951953614e-18.
  limitation: The Blender converter probe compared matrices only and did not feed its profile through the pose baker. Project integration used synthetic typed BOBJ rest matrices; real converter-to-baker parity is not yet end-to-end verified.
