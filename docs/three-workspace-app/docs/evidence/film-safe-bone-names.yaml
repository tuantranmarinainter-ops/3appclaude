  - command: node --import ./packages/builder/node_modules/tsx/dist/loader.mjs --test apps/studio/test/unifiedSceneRender.test.ts apps/studio/test/sceneRenderOutput.test.ts apps/studio/test/filmManifest.test.ts apps/studio/test/filmPoseBake.test.ts apps/studio/test/filmCamera.test.ts apps/studio/test/unifiedAssetImport.test.ts apps/studio/test/filmExportJob.integration.test.ts
