checkpoint: DOC-050
date: 2026-10-19
scope:
  listcode: [1.7.1, 1.7.2, 1.7.3]
  summary: Map unsafe source bone tokens to safe BOBJ IDs while retaining the FBXLoader-compatible source names needed for sampled editable pose tracks.
implementation:
  converter: three-workspace-app/agent/film_worker/blender/convert_model.py
  profile_validation: three-workspace-app/agent/film_model_converter.py
  manifest_and_pose_mapping:
    - three-workspace-app/editor/apps/studio/src/filmManifest.ts
    - three-workspace-app/editor/apps/studio/src/filmPoseBake.ts
    - three-workspace-app/editor/apps/studio/src/unifiedFilmSampling.ts
  tests:
    - three-workspace-app/editor/apps/studio/test/filmPoseBake.test.ts
    - three-workspace-app/editor/apps/studio/test/filmExportJob.integration.test.ts
behavior:
  - Assigns collision-free safe IDs to bone names outside the BOBJ identifier set and replaces exact whitespace-delimited tokens throughout exported BOBJ, including hierarchy, weights and action channels.
  - Preserves a unique sourceName normalized with the Three.js FBXLoader PropertyBinding.sanitizeNodeName rule; the Studio validates it against its imported skeleton and emits pose tracks under BOBJ IDs.
  - Retains hash, output-file, bone-count, hierarchy and bind-matrix validation; duplicate normalized source names are rejected.
fixture:
  name: Punch Combo FBX
  source_sha256: acd9e347686dfabda0a3cac3207885d96f466795753882284f3b4ddfb29fabeb
  converted_profile: 65 bones, 1 action, no texture; colon-bearing Mixamo source names mapped to safe BOBJ IDs and normalized source names.
  source_immutability: Source hash stayed unchanged during standalone conversion.
