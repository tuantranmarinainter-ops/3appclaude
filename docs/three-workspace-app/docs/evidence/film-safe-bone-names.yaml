    cwd: three-workspace-app
    environment: BBS_BLENDER_EXE is Blender 4.2.3; BBS_JAVA_HOME is Microsoft OpenJDK 17.0.20.101-hotspot.
    result: 5 passed, including the Blender-backed FBX/GLB converter integration.
  - command: python -m agent.unified_cli film convert-model ".test-runtime/browser/projects/112cf5a6-5c39-4853-9c8e-6d65175194ba/assets/acd9e347686dfabda0a3cac3207885d96f466795753882284f3b4ddfb29fabeb/Punch Combo.fbx" --output-dir EXISTING_FOLDER --unit-meters 1
