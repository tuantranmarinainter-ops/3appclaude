    result: 39 passed, 0 failed, 0 skipped. The opt-in export imports the FBX, adds two Characters sharing its source asset, places Motion on both, creates two contiguous camera shots with a cut, verifies both sampled poses change, runs real conversion/profile mapping and manifest, invokes the Java worker and reads the returned ZIP.
