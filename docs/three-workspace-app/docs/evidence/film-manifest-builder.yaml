  - command: node --import ./packages/builder/node_modules/tsx/dist/loader.mjs --test apps/studio/test/filmManifest.test.ts apps/studio/test/unifiedAssetImport.test.ts apps/studio/test/filmPoseBake.test.ts apps/studio/test/filmCamera.test.ts
    cwd: three-workspace-app/editor
    environment: BBS_TEST_MIXAMO_FBX points to the local Punch Combo FBX fixture
    result: 28 passed, 0 failed, 0 skipped, including Punch Combo FBX source import, project sampling, synthetic 65-bone bake, manifest mapping and rejection cases.
  - command: node node_modules/typescript/bin/tsc --noEmit -p apps/studio/tsconfig.json
    cwd: three-workspace-app/editor
