checkpoint: DOC-047
date: 2026-10-19
scope:
  listcode:
    - 1.7.1
    - 1.7.2
    - 1.7.3
  summary: Build the pinned BBS 2.4 editable Film export manifest from immutable samples and verified converter profiles.
implementation:
  manifest_builder: three-workspace-app/editor/apps/studio/src/filmManifest.ts
  project_sampling: three-workspace-app/editor/apps/studio/src/unifiedFilmSampling.ts
  tests: three-workspace-app/editor/apps/studio/test/filmManifest.test.ts
  behavior:
    - Maps selected Characters to content-hash-bound converted model profiles and hashed BOBJ/texture paths.
    - Bakes skeleton samples into pose_transform tracks and emits one actor transform key per 20 Hz tick.
    - Converts Three actor world transforms to BBS yaw/pitch; blocks scale, roll, shear and non-finite values the Replay schema cannot represent.
    - Preserves sampled camera clips and project/source provenance in worker manifest JSON.
runtime:
  fixture: Temporary one-bone rig generated/exported as FBX with Blender 5.1.2; converted by the real BBS model converter. FBXLoader rest data and converter profile passed through the Studio manifest builder and Java 17 native Film worker.
  result: Builder emitted one actor, one BOBJ model, one camera and one editable bone track with two keys. Worker returned success with nativeReadback=true, actor=1, camera=1, poseTracks=1. All inputs and package lived in an auto-cleaned temporary directory.
  limitation: Smoke sample was assembled manually and static; it does not exercise the full shared-project sampler, multi-shot cuts, 65-bone motion or UI/job/API wiring.
