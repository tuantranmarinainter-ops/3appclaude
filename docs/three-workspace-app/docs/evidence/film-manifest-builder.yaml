  - Actor scale and roll are blocked until a verified BBS representation or model-bake path exists; orthographic camera and source restrictions from DOC-045 remain.
  - Blender 2.79 on PATH is unsupported; smoke explicitly used workspace Blender 5.1.2 and Java 17.
