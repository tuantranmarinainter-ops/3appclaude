limits:
  - The successful project-scoped job used a generated static two-bone FBX. Animated FBX standalone conversion passed, but the full animated project job failed at 8%; its generic public error does not identify the failed internal stage.
  - Browser coverage only checks panel mounting, control presence, empty-project disabled state and absence of page errors; it does not run export or use the folder picker.
  - Multiple Characters/camera cuts, broad third-party rig compatibility, arbitrary production assets, Film Editor open/edit/save/reopen, Minecraft playback and live MCP host remain unverified.
  - DOC-047's generated one-bone smoke and DOC-048's static project job are native-readback evidence; no production-source or animated-project native readback exists yet.
  - No original Animation/Retarget/Topview source, game, Site, release or commit was changed.
