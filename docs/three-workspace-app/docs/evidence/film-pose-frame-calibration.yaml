limits:
  - Full job evidence is a generated safe-name two-bone FBX. It does not establish compatibility with arbitrary production rigs.
  - Punch Combo source skeleton import/sampling passes, but its names are rejected by the BOBJ converter's safe-name validation; name mapping remains open.
  - Multiple Characters/camera cuts, Film Editor open/edit/save/reopen, Minecraft playback and live MCP host were not checked.
  - No original Animation/Retarget/Topview workspace, game installation, Site, release or commit was changed.
