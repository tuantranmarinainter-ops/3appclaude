coordinate_policy:
  decision: Preserve upstream native representations and convert at explicit adapters
  required_metadata:
  - unit
  - up-axis
  - rotation convention
  - fps/tick rate
  - root-motion owner
  canonical: Topview Y-up/metres scene; native rig basis/units preserved by adapters; contracts/project-v1.yaml
data_authority:
  decision: One project writer/operation boundary; do not let React and Python independently mutate the same Topview files
  revision: Shared exact CAS revision above native Topview sceneSequence; Node host single writer; commands-v1.yaml
preservation: Keep original project/asset bytes on import; write converted project separately and report lossy fields
