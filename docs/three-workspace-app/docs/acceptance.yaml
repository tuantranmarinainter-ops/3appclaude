schema_version: '1'
status: normative-test-spec; partial implementation evidence, no full acceptance
tolerances:
  exact: IDs/names/hierarchy/flags/counts/hash/native JSON data exact (ignore property order only); error codes exact
  adapter: position max1e-5m, quaternion angular max0.001deg using2acos(abs(dot)), scale max1e-6, time max1e-6s; compare all bones/frames not
    mean only
  retarget: native parity adapter thresholds; semantic foot-lock drift<=0.005m for locked interval on selected ground fixture; disclose model
    constraints
  format: position max0.001m, rotation max0.1deg, scale max1e-4; duration<=half output sample interval; geometry rest displacement<=0.001m; topology/bone/action
    names exact; texture bytes hash exact unless explicit conversion
  film: world position max0.001block, pose rotation max0.1deg, FOV max0.1deg; shot bounds exact integer ticks; sampled animation time<=0.025s;3s
    shot exactly60ticks; key edit persistence exact within numeric thresholds
  visual: Same GPU/browser/render size required; compare numeric transforms first; silhouette/framing edge<=2px at1366x768; material alpha/occlusion
    must match; differences require review, no broad pixel-percent waiver
